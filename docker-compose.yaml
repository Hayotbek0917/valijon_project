services:
  backend:
    build: ./backend
    env_file:
      - backend/.env
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8001/api/v1"
    ports:
      - "5173:80"
    depends_on:
      - backend