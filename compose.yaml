# Valijon POS — bitta buyruq: docker compose up
# Frontend: http://localhost:5173  Backend: http://localhost:8000

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
      POSTGRES_DB: pos_cursor
    ports:
      - "5433:5432"
    volumes:
      - pos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_cursor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pos_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: pos_cursor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
      DATABASE_URL: postgresql://postgres:1@postgres:5432/pos_cursor
      USE_SQLITE: "false"
      DJANGO_SECRET_KEY: docker-dev-secret-key-change-in-production
      DEBUG: "true"
      ENABLE_SILK: "1"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      SEED_MAGAZIN: "1"
      SEED_MAGAZIN_COUNT: "100"
      SEED_PRODUCTS_MIN: "500"
      SEED_PRODUCTS_MAX: "1000"
      SEED_SUPPLIERS_MIN: "30"
      SEED_SUPPLIERS_MAX: "50"
      SEED_DEBTORS_MIN: "200"
      SEED_DEBTORS_MAX: "300"
      SEED_DAILY_SALES_MIN: "25"
      SEED_DAILY_SALES_MAX: "45"
      SEED_HISTORY_DAYS: "30"
      SEED_REVENUE_MIN: "5000000"
      SEED_REVENUE_MAX: "10000000"
      SEED_SUB_BRANCHES_MIN: "1"
      SEED_SUB_BRANCHES_MAX: "3"
      # Tez sinov uchun: SEED_QUICK=1 (3 ta magazin, kichik hajm)
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: pos_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pos_pg_data:
  frontend_node_modules:
